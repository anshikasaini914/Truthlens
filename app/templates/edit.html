{% extends "base.html" %}
{% block title %}Edit claim — TruthLens{% endblock %}
{% block content %}
<a href="/claims/{{ claim.id }}" class="text-sm text-indigo-600 hover:underline">&larr; Back to claim</a>

<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-4">
  <h1 class="text-xl font-bold mb-1">Edit claim #{{ claim.id }}</h1>
  <p class="text-sm text-gray-500 mb-5">Editing is allowed — risk flags will be recalculated on save. Review status and notes are untouched.</p>

  <form method="post" action="/claims/{{ claim.id }}/edit" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Claim text</label>
      <textarea name="text" required rows="5"
        class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">{{ claim.text }}</textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Source platform</label>
        <select name="source_platform" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
          {% for p in platforms %}<option value="{{ p }}" {% if p == claim.source_platform %}selected{% endif %}>{{ p }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Category</label>
        <select name="category" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
          {% for c in categories %}<option value="{{ c }}" {% if c == claim.category %}selected{% endif %}>{{ c }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Source link <span class="text-gray-400 font-normal">(optional)</span></label>
      <input type="url" name="source_link" value="{{ claim.source_link or '' }}"
        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>

    <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700">
      Save changes
    </button>
  </form>
</div>
{% endblock %}
