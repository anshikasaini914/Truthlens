{% extends "base.html" %}
{% block title %}Submit a claim — TruthLens{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
  <h1 class="text-xl font-bold mb-1">Submit a claim</h1>
  <p class="text-sm text-gray-500 mb-5">Paste the viral text as-is. We'll auto-flag risk signals — a human still reviews it.</p>

  <form method="post" action="/submit" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Claim text</label>
      <textarea name="text" required rows="5" placeholder="Paste the viral post's text here..."
        class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Source platform</label>
        <select name="source_platform" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
          {% for p in platforms %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Category</label>
        <select name="category" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
          {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Source link <span class="text-gray-400 font-normal">(optional)</span></label>
      <input type="url" name="source_link" placeholder="https://..."
        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      <p class="text-xs text-gray-400 mt-1">No link → flagged as "Unsourced".</p>
    </div>

    <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700">
      Submit claim
    </button>
  </form>
</div>
{% endblock %}
