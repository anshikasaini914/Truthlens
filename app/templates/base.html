<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}TruthLens{% endblock %}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background:#f7f7f8; }
  .badge { display:inline-block; padding:2px 10px; border-radius:9999px; font-size:12px; font-weight:600; }
</style>
</head>
<body class="min-h-screen text-gray-900">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/feed" class="flex items-center gap-2 font-bold text-lg text-indigo-700">
        <span>🔍</span> TruthLens
      </a>
      <nav class="flex gap-4 text-sm font-medium">
        <a href="/feed" class="text-gray-600 hover:text-indigo-700">Feed</a>
        <a href="/submit" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg hover:bg-indigo-700">+ Submit a claim</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-xs text-gray-400 py-8">
    TruthLens — a neutral misinformation triage tool. Checks information, not ideologies.
  </footer>
</body>
</html>
